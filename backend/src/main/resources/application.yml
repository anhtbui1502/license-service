server:
  port: 8080
  # Sau nginx: lấy IP thật của client từ X-Forwarded-For (chỉ tin proxy trong mạng nội bộ)
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: license-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/license}
    username: ${DB_USERNAME:license}
    password: ${DB_PASSWORD:license}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

app:
  timezone: ${APP_TIMEZONE:Asia/Ho_Chi_Minh}
  approver:
    # Email người duyệt (giám đốc) nhận OTP
    email: ${APPROVER_EMAIL}
    name: ${APPROVER_NAME:Người duyệt}
  mail:
    from: ${MAIL_FROM:license-manager@localhost}
  otp:
    ttl: ${OTP_TTL:30m}
    resend-cooldown: ${OTP_RESEND_COOLDOWN:60s}
    max-resends: ${OTP_MAX_RESENDS:3}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    # Trần số email OTP gửi đi trong 1 giờ (toàn hệ thống / mỗi người dùng)
    max-emails-per-hour: ${OTP_MAX_EMAILS_PER_HOUR:30}
    max-emails-per-hour-per-user: ${OTP_MAX_EMAILS_PER_HOUR_PER_USER:10}
    # Khóa HMAC để băm OTP trước khi lưu DB, tối thiểu 32 ký tự
    hmac-secret: ${OTP_HMAC_SECRET}
  license:
    # mock = định dạng tạm khi chưa có thuật toán mã hóa thật
    crypto: ${LICENSE_CRYPTO:mock}
  bootstrap:
    # Tạo tài khoản ADMIN đầu tiên khi bảng user còn trống
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:admin@localhost}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    # Mỗi request được kiểm tra với mọi rule khớp method + path.
    # key: IP (theo địa chỉ client) hoặc USER (theo tài khoản đăng nhập, chưa đăng nhập thì theo IP)
    rules:
      - name: login
        method: POST
        path: /api/auth/login
        key: IP
        capacity: 10
        period: 1m
      - name: request-create
        method: POST
        path: /api/requests
        key: USER
        capacity: 5
        period: 1m
      - name: otp-resend
        method: POST
        path: /api/requests/*/resend-otp
        key: USER
        capacity: 5
        period: 1m
      - name: otp-verify-user
        method: POST
        path: /api/requests/*/verify
        key: USER
        capacity: 10
        period: 1m
      - name: otp-verify-ip
        method: POST
        path: /api/requests/*/verify
        key: IP
        capacity: 20
        period: 1m
      - name: api-default
        path: /api/**
        key: USER
        capacity: 300
        period: 1m

logging:
  level:
    com.vht.license: INFO
